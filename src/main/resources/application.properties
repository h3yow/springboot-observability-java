spring.application.name=springboot-observability-java

# Observability pipeline
observability.export-queue-capacity=1024
observability.offer-timeout-millis=0
observability.export-timeout-millis=500
observability.request-id-header=X-Request-Id

# Head sampling (export side only; per-request metrics are always recorded).
# Ratio in [0,1]: 1.0 = export every event (default, pre-sampling behavior),
# 0.0 = export nothing. Endpoint keys are the stable "METHOD /pattern" names.
observability.sampling.default-ratio=1.0
# Per-endpoint overrides (uncomment to enable); endpoints not listed use the default:
# observability.sampling.endpoints.GET\ /demo/work=0.1
# observability.sampling.endpoints.GET\ /demo/fail=1.0
