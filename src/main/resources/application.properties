spring.application.name=springboot-observability-java

# Observability pipeline
observability.export-queue-capacity=1024
observability.offer-timeout-millis=0
observability.export-timeout-millis=500
observability.request-id-header=X-Request-Id

# Sampling policy (rates are in [0.0, 1.0]; 1.0 = keep all, 0.0 = drop all).
# Endpoints without an override follow the default rate; names are "METHOD /path".
observability.default-sample-rate=1.0
#observability.sample-rates[GET /demo/work]=0.1
#observability.sample-rates[GET /demo/fail]=1.0
